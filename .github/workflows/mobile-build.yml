name: Mobile Build

on:
  workflow_dispatch:
    inputs:
      build_profile:
        description: "EAS build profile"
        required: false
        type: choice
        options:
          - preview
          - development
          - production
        default: preview
      build_platform:
        description: "Target platform"
        required: false
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      wait_for_build:
        description: "Wait until build completes"
        required: false
        type: boolean
        default: false
      release_notes:
        description: "Operator-facing release notes for this mobile build"
        required: false
        type: string
      submit_to_store:
        description: "Submit the latest production EAS build to configured stores"
        required: false
        type: boolean
        default: false
      submit_platform:
        description: "Store submit platform"
        required: false
        type: choice
        options:
          - all
          - ios
          - android
        default: all
      wait_for_submit:
        description: "Wait until EAS submit completes"
        required: false
        type: boolean
        default: false
      what_to_test:
        description: "Optional TestFlight 'What to Test' text for iOS submit"
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "apps/field-mobile/**"
      - "docs/mobile-device-smoke-log-template-v0.1.json"
      - "docs/mobile-store-rollout-handoff-template-v0.1.json"
      - "scripts/build_mobile_dependency_review.py"
      - "scripts/build_mobile_release_manifest.py"
      - "scripts/check_mobile_release_readiness.py"
      - "scripts/validate_mobile_device_smoke_log.py"
      - "scripts/validate_mobile_store_rollout_handoff.py"
      - "scripts/verify_mobile_release_bundle.py"
      - "tests/test_mobile_dependency_review.py"
      - "tests/test_mobile_device_smoke_log.py"
      - "tests/test_mobile_release_bundle_verifier.py"
      - "tests/test_mobile_store_rollout_handoff.py"
      - ".github/workflows/mobile-build.yml"
  pull_request:
    paths:
      - "apps/field-mobile/**"
      - "docs/mobile-device-smoke-log-template-v0.1.json"
      - "docs/mobile-store-rollout-handoff-template-v0.1.json"
      - "scripts/build_mobile_dependency_review.py"
      - "scripts/build_mobile_release_manifest.py"
      - "scripts/check_mobile_release_readiness.py"
      - "scripts/validate_mobile_device_smoke_log.py"
      - "scripts/validate_mobile_store_rollout_handoff.py"
      - "scripts/verify_mobile_release_bundle.py"
      - "tests/test_mobile_dependency_review.py"
      - "tests/test_mobile_device_smoke_log.py"
      - "tests/test_mobile_release_bundle_verifier.py"
      - "tests/test_mobile_store_rollout_handoff.py"
      - ".github/workflows/mobile-build.yml"

concurrency:
  group: mobile-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      authenticated_eas_status: ${{ steps.readiness.outputs.authenticated_eas_status }}
      authenticated_eas_blockers: ${{ steps.readiness.outputs.authenticated_eas_blockers }}

    defaults:
      run:
        working-directory: apps/field-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.x"
          cache: "npm"
          cache-dependency-path: apps/field-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build dependency review report
        shell: bash
        run: |
          set +e
          npm audit --omit=dev --json > /tmp/mobile-npm-audit-prod.json
          audit_exit_code=$?
          python3 ../../scripts/build_mobile_dependency_review.py \
            --package-json package.json \
            --package-lock package-lock.json \
            --audit-json /tmp/mobile-npm-audit-prod.json \
            --output /tmp/mobile-dependency-review.json
          review_exit_code=$?
          set -e
          echo "$audit_exit_code" > /tmp/mobile-npm-audit-prod-exit-code
          echo "$review_exit_code" > /tmp/mobile-dependency-review-exit-code

      - name: Publish dependency review summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("/tmp/mobile-dependency-review.json").read_text(encoding="utf-8"))
          failed = payload.get("failed_checks", [])
          vulnerabilities = payload.get("audit", {}).get("vulnerabilities", {})
          lines = [
              "## Mobile Dependency Review",
              f"- Status: `{payload.get('status')}`",
              f"- Risk traceability: `{payload.get('risk_traceability', {}).get('risk_id')}`",
              f"- Production vulnerabilities: `{vulnerabilities.get('total', 'unknown')}`",
              f"- Direct production dependencies: `{payload.get('lockfile', {}).get('direct_production_dependency_count')}`",
              f"- Direct development dependencies: `{payload.get('lockfile', {}).get('direct_development_dependency_count')}`",
              f"- Failed checks: `{', '.join(failed) if failed else 'none'}`",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Upload dependency review
        uses: actions/upload-artifact@v7
        with:
          name: mobile-dependency-review
          path: |
            /tmp/mobile-dependency-review.json
            /tmp/mobile-npm-audit-prod.json
            /tmp/mobile-npm-audit-prod-exit-code
          if-no-files-found: error

      - name: Fail on dependency review errors
        shell: bash
        run: |
          set -euo pipefail
          review_exit_code="$(cat /tmp/mobile-dependency-review-exit-code 2>/dev/null || echo 1)"
          if [[ "$review_exit_code" != "0" ]]; then
            echo "Mobile dependency review failed with exit code $review_exit_code."
            echo "See the mobile-dependency-review artifact for dependency/audit evidence."
            exit "$review_exit_code"
          fi

      - name: Validate Expo project
        run: npm run validate:ci

      - name: Build release readiness report
        shell: bash
        env:
          CLINICAL_HUB_API_KEY: ${{ secrets.CLINICAL_HUB_API_KEY }}
          CLINICAL_HUB_URL: ${{ secrets.CLINICAL_HUB_URL }}
          EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          set +e
          python3 ../../scripts/check_mobile_release_readiness.py \
            --app-json app.json \
            --eas-json eas.json \
            --package-json package.json \
            --package-lock package-lock.json \
            --output /tmp/mobile-release-readiness.json
          readiness_exit_code=$?
          set -e
          echo "$readiness_exit_code" > /tmp/mobile-release-readiness-exit-code

      - name: Export release readiness outputs
        id: readiness
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("/tmp/mobile-release-readiness.json").read_text(encoding="utf-8"))
          blockers = payload.get("authenticated_eas_blockers", [])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(
                  f"authenticated_eas_status={payload.get('authenticated_eas_status', 'blocked')}\n"
              )
              handle.write(f"authenticated_eas_blockers={','.join(blockers)}\n")
          PY

      - name: Publish release readiness summary
        shell: bash
        env:
          WORKFLOW_SUBMIT_TO_STORE: ${{ github.event.inputs.submit_to_store || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("/tmp/mobile-release-readiness.json").read_text(encoding="utf-8"))
          missing = [
              item["id"]
              for item in payload.get("external_items", [])
              if item.get("status") == "missing"
          ]
          invalid = [
              item["id"]
              for item in payload.get("external_items", [])
              if item.get("status") == "invalid"
          ]
          manual = [
              item["id"]
              for item in payload.get("manual_external_items", [])
              if item.get("status") == "manual_required"
          ]
          next_actions = [
              item["id"]
              for item in payload.get("next_actions", [])
              if item.get("id")
          ]
          authenticated_eas_status = payload.get("authenticated_eas_status")
          eas_trigger_status = "enabled" if authenticated_eas_status == "pass" else "blocked"
          submit_requested = os.environ.get("WORKFLOW_SUBMIT_TO_STORE", "false").lower() == "true"
          eas_submit_trigger_status = (
              "enabled"
              if submit_requested and authenticated_eas_status == "pass"
              else "blocked"
              if submit_requested
              else "not_requested"
          )
          lines = [
              "## Mobile Release Readiness",
              f"- Status: `{payload.get('status')}`",
              f"- Local checks: `{payload.get('local_checks_status')}`",
              f"- External readiness: `{payload.get('external_readiness_status')}`",
              f"- Authenticated EAS readiness: `{authenticated_eas_status}`",
              f"- Authenticated EAS blockers: `{', '.join(payload.get('authenticated_eas_blockers', [])) if payload.get('authenticated_eas_blockers') else 'none'}`",
              f"- Authenticated EAS build trigger: `{eas_trigger_status}`",
              f"- Authenticated EAS submit trigger: `{eas_submit_trigger_status}`",
              f"- Clinical Hub live API: `{payload.get('clinical_hub_live_api_status')}`",
              f"- Missing external items: `{', '.join(missing) if missing else 'none'}`",
              f"- Invalid external items: `{', '.join(invalid) if invalid else 'none'}`",
              f"- Manual external items: `{', '.join(manual) if manual else 'none'}`",
              f"- Next actions: `{', '.join(next_actions) if next_actions else 'none'}`",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Build smoke template validation artifact
        shell: bash
        run: |
          cp ../../docs/mobile-device-smoke-log-template-v0.1.json \
            /tmp/mobile-device-smoke-log-template-v0.1.json
          set +e
          python3 ../../scripts/validate_mobile_device_smoke_log.py \
            /tmp/mobile-device-smoke-log-template-v0.1.json \
            --output /tmp/mobile-device-smoke-template-summary.json
          smoke_template_exit_code=$?
          set -e
          echo "$smoke_template_exit_code" > /tmp/mobile-device-smoke-template-exit-code

      - name: Publish smoke template validation summary
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(
              Path("/tmp/mobile-device-smoke-template-summary.json").read_text(
                  encoding="utf-8"
              )
          )
          lines = [
              "## Mobile Device Smoke Template Validation",
              f"- Status: `{payload.get('status')}`",
              f"- Device count: `{payload.get('device_count')}`",
              f"- Platforms: `{', '.join(payload.get('platforms_seen', [])) or 'none'}`",
              f"- Required check IDs: `{', '.join(payload.get('required_check_ids', []))}`",
              f"- Errors: `{', '.join(payload.get('errors', [])) if payload.get('errors') else 'none'}`",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("\n".join(lines) + "\n")
          PY

      - name: Build release notes artifact
        env:
          WORKFLOW_BUILD_PROFILE: ${{ github.event.inputs.build_profile || 'preview' }}
          WORKFLOW_BUILD_PLATFORM: ${{ github.event.inputs.build_platform || 'all' }}
          WORKFLOW_RELEASE_NOTES: ${{ github.event.inputs.release_notes || '' }}
          WORKFLOW_SUBMIT_TO_STORE: ${{ github.event.inputs.submit_to_store || 'false' }}
          WORKFLOW_SUBMIT_PLATFORM: ${{ github.event.inputs.submit_platform || 'all' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          notes = os.environ.get("WORKFLOW_RELEASE_NOTES", "").strip()
          if not notes:
              notes = (
                  "No operator-facing release notes were supplied for this run. "
                  "Use the workflow_dispatch release_notes input for clinic handoff notes."
              )

          lines = [
              "# Uroflow Field Mobile Release Notes",
              "",
              f"- Git SHA: `{os.environ.get('GITHUB_SHA', 'local')}`",
              f"- Git ref: `{os.environ.get('GITHUB_REF', 'local')}`",
              f"- GitHub run: `{os.environ.get('GITHUB_RUN_ID', 'local')}`",
              f"- Build profile: `{os.environ.get('WORKFLOW_BUILD_PROFILE', 'preview')}`",
              f"- Build platform: `{os.environ.get('WORKFLOW_BUILD_PLATFORM', 'all')}`",
              f"- Store submit requested: `{os.environ.get('WORKFLOW_SUBMIT_TO_STORE', 'false')}`",
              f"- Store submit platform: `{os.environ.get('WORKFLOW_SUBMIT_PLATFORM', 'all')}`",
              "",
              "## Operator Notes",
              "",
              notes,
              "",
              "## Required Evidence",
              "",
              "- Download `mobile-release-manifest`.",
              "- Download `mobile-release-readiness`.",
              "- Download `mobile-release-bundle-verification`.",
              "- Download `mobile-dependency-review`.",
              "- Download `mobile-device-smoke-template-validation` before filling real-device smoke evidence.",
              "- Download `mobile-store-rollout-handoff` and fill in TestFlight/Play evidence after external account setup.",
              "- Archive iOS/Android EAS build links when authenticated EAS build runs.",
              "- Archive physical-device smoke log with device model and OS version.",
          ]
          Path("/tmp/mobile-release-notes.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Build release manifest
        env:
          WORKFLOW_BUILD_PROFILE: ${{ github.event.inputs.build_profile || 'preview' }}
        run: |
          profile="${WORKFLOW_BUILD_PROFILE:-preview}"
          channel="$profile"
          if [[ "$profile" == "development" ]]; then
            channel="development"
          elif [[ "$profile" == "production" ]]; then
            channel="production"
          fi
          python3 ../../scripts/build_mobile_release_manifest.py \
            --app-json app.json \
            --output /tmp/mobile-release-manifest.json \
            --readiness-json /tmp/mobile-release-readiness.json \
            --release-notes /tmp/mobile-release-notes.md \
            --profile "$profile" \
            --channel "$channel" \
            --model-id fusion-v0.1 \
            --schema-version ios_capture_v1

      - name: Build store rollout handoff artifact
        env:
          WORKFLOW_BUILD_PROFILE: ${{ github.event.inputs.build_profile || 'preview' }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          def sha256_file(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          template = json.loads(
              Path("../../docs/mobile-store-rollout-handoff-template-v0.1.json").read_text(
                  encoding="utf-8"
              )
          )
          app_payload = json.loads(Path("app.json").read_text(encoding="utf-8"))
          expo = app_payload.get("expo", {})
          profile = os.environ.get("WORKFLOW_BUILD_PROFILE", "preview")
          channel = profile
          if profile == "development":
              channel = "development"
          elif profile == "production":
              channel = "production"

          template["prepared_at_utc"] = datetime.now(timezone.utc).isoformat().replace(
              "+00:00", "Z"
          )
          template["release"].update(
              {
                  "git_sha": os.environ.get("GITHUB_SHA", "local"),
                  "app_version": expo.get("version", ""),
                  "build_profile": profile,
                  "build_channel": channel,
                  "mobile_release_manifest_sha256": sha256_file(
                      Path("/tmp/mobile-release-manifest.json")
                  ),
                  "mobile_release_readiness_sha256": sha256_file(
                      Path("/tmp/mobile-release-readiness.json")
                  ),
                  "mobile_release_notes_sha256": sha256_file(
                      Path("/tmp/mobile-release-notes.md")
                  ),
                  "mobile_device_smoke_template_summary_sha256": sha256_file(
                      Path("/tmp/mobile-device-smoke-template-summary.json")
                  ),
              }
          )
          Path("/tmp/mobile-store-rollout-handoff.json").write_text(
              json.dumps(template, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
          python3 ../../scripts/validate_mobile_store_rollout_handoff.py \
            /tmp/mobile-store-rollout-handoff.json \
            --output /tmp/mobile-store-rollout-handoff-summary.json

      - name: Verify release artifact bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 ../../scripts/verify_mobile_release_bundle.py \
            --manifest-json /tmp/mobile-release-manifest.json \
            --readiness-json /tmp/mobile-release-readiness.json \
            --release-notes /tmp/mobile-release-notes.md \
            --smoke-template-summary-json /tmp/mobile-device-smoke-template-summary.json \
            --store-rollout-handoff-json /tmp/mobile-store-rollout-handoff.json \
            --store-rollout-summary-json /tmp/mobile-store-rollout-handoff-summary.json \
            --expect-git-sha "$GITHUB_SHA" \
            --expect-run-id "$GITHUB_RUN_ID" \
            --output /tmp/mobile-release-bundle-verification.json

      - name: Upload release notes
        uses: actions/upload-artifact@v7
        with:
          name: mobile-release-notes
          path: /tmp/mobile-release-notes.md

      - name: Upload release manifest
        uses: actions/upload-artifact@v7
        with:
          name: mobile-release-manifest
          path: /tmp/mobile-release-manifest.json

      - name: Upload release readiness report
        uses: actions/upload-artifact@v7
        with:
          name: mobile-release-readiness
          path: /tmp/mobile-release-readiness.json

      - name: Upload release bundle verification
        uses: actions/upload-artifact@v7
        with:
          name: mobile-release-bundle-verification
          path: /tmp/mobile-release-bundle-verification.json

      - name: Upload store rollout handoff
        uses: actions/upload-artifact@v7
        with:
          name: mobile-store-rollout-handoff
          path: |
            /tmp/mobile-store-rollout-handoff.json
            /tmp/mobile-store-rollout-handoff-summary.json

      - name: Upload smoke template validation
        uses: actions/upload-artifact@v7
        with:
          name: mobile-device-smoke-template-validation
          path: |
            /tmp/mobile-device-smoke-log-template-v0.1.json
            /tmp/mobile-device-smoke-template-summary.json
            /tmp/mobile-device-smoke-template-exit-code
          if-no-files-found: error

      - name: Fail on smoke template validation errors
        shell: bash
        run: |
          set -euo pipefail
          smoke_template_exit_code="$(cat /tmp/mobile-device-smoke-template-exit-code 2>/dev/null || echo 1)"
          if [[ "$smoke_template_exit_code" != "0" ]]; then
            echo "Mobile device smoke template validation failed with exit code $smoke_template_exit_code."
            echo "See the mobile-device-smoke-template-validation artifact for template summary details."
            exit "$smoke_template_exit_code"
          fi

      - name: Fail on local release readiness errors
        shell: bash
        run: |
          set -euo pipefail
          readiness_exit_code="$(cat /tmp/mobile-release-readiness-exit-code 2>/dev/null || echo 1)"
          if [[ "$readiness_exit_code" != "0" ]]; then
            echo "Mobile release readiness failed with exit code $readiness_exit_code."
            echo "See the mobile-release-readiness artifact for local check details."
            exit "$readiness_exit_code"
          fi

  eas-build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' && needs.preflight.outputs.authenticated_eas_status == 'pass' }}

    defaults:
      run:
        working-directory: apps/field-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.x"
          cache: "npm"
          cache-dependency-path: apps/field-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install -g eas-cli@20.0.0

      - name: Trigger EAS build
        id: eas
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          WORKFLOW_BUILD_PROFILE: ${{ github.event.inputs.build_profile || 'preview' }}
          WORKFLOW_BUILD_PLATFORM: ${{ github.event.inputs.build_platform || 'all' }}
          WORKFLOW_WAIT_FOR_BUILD: ${{ github.event.inputs.wait_for_build || 'false' }}
        run: |
          set -euo pipefail
          profile="${WORKFLOW_BUILD_PROFILE:-preview}"
          platform="${WORKFLOW_BUILD_PLATFORM:-all}"
          wait_for_build="${WORKFLOW_WAIT_FOR_BUILD:-false}"

          cmd=(eas build --platform "$platform" --profile "$profile" --non-interactive --json)
          if [[ "$wait_for_build" == "true" ]]; then
            cmd+=(--wait)
          else
            cmd+=(--no-wait)
          fi

          "${cmd[@]}" > /tmp/eas-build-result.json
          echo "result_json=/tmp/eas-build-result.json" >> "$GITHUB_OUTPUT"

      - name: Upload EAS build result artifact
        uses: actions/upload-artifact@v7
        with:
          name: mobile-eas-build-result-${{ github.run_id }}
          path: /tmp/eas-build-result.json
          if-no-files-found: error

      - name: Publish EAS build summary
        shell: bash
        env:
          RESULT_JSON: ${{ steps.eas.outputs.result_json }}
          WORKFLOW_BUILD_PROFILE: ${{ github.event.inputs.build_profile || 'preview' }}
          WORKFLOW_BUILD_PLATFORM: ${{ github.event.inputs.build_platform || 'all' }}
          WORKFLOW_WAIT_FOR_BUILD: ${{ github.event.inputs.wait_for_build || 'false' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          result_path = Path(os.environ["RESULT_JSON"])
          payload = json.loads(result_path.read_text(encoding="utf-8"))
          builds = payload if isinstance(payload, list) else [payload]

          lines = [
              "## Mobile EAS Build",
              f"- Profile: `{os.environ.get('WORKFLOW_BUILD_PROFILE', 'preview')}`",
              f"- Platform: `{os.environ.get('WORKFLOW_BUILD_PLATFORM', 'all')}`",
              f"- Wait mode: `{os.environ.get('WORKFLOW_WAIT_FOR_BUILD', 'false')}`",
              f"- Result JSON: `{result_path}`",
              "",
              "### Build Links",
          ]

          if not builds:
              lines.append("- No build records returned by EAS.")
          else:
              for index, item in enumerate(builds, start=1):
                  if not isinstance(item, dict):
                      lines.append(f"- Build {index}: unexpected payload shape")
                      continue
                  platform = item.get("platform", "unknown")
                  build_id = item.get("id", "-")
                  status = item.get("status", "-")
                  web_url = item.get("webUrl") or item.get("artifacts", {}).get("buildUrl")
                  lines.append(
                      f"- `{platform}` build `{build_id}` status `{status}`"
                      + (f" ([open]({web_url}))" if web_url else "")
                  )

          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

  eas-submit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: preflight
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.submit_to_store == 'true' && needs.preflight.outputs.authenticated_eas_status == 'pass' }}

    defaults:
      run:
        working-directory: apps/field-mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22.13.x"
          cache: "npm"
          cache-dependency-path: apps/field-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install EAS CLI
        run: npm install -g eas-cli@20.0.0

      - name: Trigger EAS submit
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          WORKFLOW_SUBMIT_PLATFORM: ${{ github.event.inputs.submit_platform || 'all' }}
          WORKFLOW_WAIT_FOR_SUBMIT: ${{ github.event.inputs.wait_for_submit || 'false' }}
          WORKFLOW_WHAT_TO_TEST: ${{ github.event.inputs.what_to_test || '' }}
        run: |
          set -euo pipefail
          platform="${WORKFLOW_SUBMIT_PLATFORM:-all}"
          wait_for_submit="${WORKFLOW_WAIT_FOR_SUBMIT:-false}"
          what_to_test="${WORKFLOW_WHAT_TO_TEST:-}"

          cmd=(eas submit --platform "$platform" --profile production --latest --non-interactive)
          if [[ "$wait_for_submit" == "true" ]]; then
            cmd+=(--wait)
          else
            cmd+=(--no-wait)
          fi
          if [[ -n "$what_to_test" && "$platform" == "ios" ]]; then
            cmd+=(--what-to-test "$what_to_test")
          fi

          {
            printf 'Command:'
            printf ' %q' "${cmd[@]}"
            printf '\n\n'
          } > /tmp/eas-submit-result.log

          set +e
          "${cmd[@]}" >> /tmp/eas-submit-result.log 2>&1
          submit_exit_code=$?
          set -e
          cat /tmp/eas-submit-result.log
          echo "$submit_exit_code" > /tmp/eas-submit-exit-code
          exit "$submit_exit_code"

      - name: Upload EAS submit result artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: mobile-eas-submit-result-${{ github.run_id }}
          path: |
            /tmp/eas-submit-result.log
            /tmp/eas-submit-exit-code
          if-no-files-found: warn

      - name: Publish EAS submit summary
        if: ${{ always() }}
        shell: bash
        env:
          WORKFLOW_SUBMIT_PLATFORM: ${{ github.event.inputs.submit_platform || 'all' }}
          WORKFLOW_WAIT_FOR_SUBMIT: ${{ github.event.inputs.wait_for_submit || 'false' }}
        run: |
          set -euo pipefail
          submit_exit_code="$(cat /tmp/eas-submit-exit-code 2>/dev/null || echo not-run)"
          {
            echo "## Mobile EAS Submit"
            echo "- Profile: \`production\`"
            echo "- Platform: \`${WORKFLOW_SUBMIT_PLATFORM:-all}\`"
            echo "- Build source: \`latest\`"
            echo "- Wait mode: \`${WORKFLOW_WAIT_FOR_SUBMIT:-false}\`"
            echo "- Exit code: \`${submit_exit_code}\`"
            echo "- Result artifact: \`mobile-eas-submit-result-${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
